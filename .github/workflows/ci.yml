name: validate
on: [push, pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter autoblogger-recorder package
      - uses: actions/upload-artifact@v4
        with:
          name: autoblogger-vsix
          path: apps/extension/dist/*.vsix
