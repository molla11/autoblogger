# Optional local PostgreSQL/Redis. The application can also use zero-setup PGlite.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autoblogger
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: autoblogger
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoblogger']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
volumes:
  postgres-data:
  redis-data:
